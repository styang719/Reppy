name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (app and scripts)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Bundle
        # Catches broken imports and Babel config that typecheck alone misses.
        run: npx expo export --platform ios --output-dir /tmp/expo-export
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder
